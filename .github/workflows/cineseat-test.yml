name: CineSeat tests

on:
  push:
    paths:
      - "projects/003-cineseat/**"
      - ".github/workflows/cineseat-test.yml"
  pull_request:
    paths:
      - "projects/003-cineseat/**"
      - ".github/workflows/cineseat-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/003-cineseat

    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-only-not-a-real-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/003-cineseat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build
