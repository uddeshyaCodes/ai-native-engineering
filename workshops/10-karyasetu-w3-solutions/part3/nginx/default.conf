# A production-shaped front door for the API.
#
#   docker compose --profile proxy up --build     ->  http://127.0.0.1:8080
#
# Why `gzip` is here, on purpose: any layer between your generator and the
# user's eyeball can hold a stream until it ends, and compression is the
# classic offender -- gzip wants a block of bytes before it emits anything.
# Many real configs compress every text-like type, event streams included.
# (We tested: with nginx's defaults alone, a small stream passed straight
# through. Compression is what made it batch.)
#
# The app can opt out, per response, with `X-Accel-Buffering: no` (app/sse.py).
#
#   header present  -> tokens arrive one at a time
#   header deleted  -> the whole cover letter arrives in ONE lump at the end
#
# See it in the browser demo page, or with `curl --compressed -N`. A plain
# `curl -N` never asks for compression, so it will look fine either way.
server {
    listen 80;

    gzip on;
    gzip_types text/event-stream application/json;
    gzip_proxied any;

    location / {
        proxy_pass http://api:8000;   # "api" is the compose service name, used as a hostname
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;      # the default (60s) is short for a long generation
    }
}
